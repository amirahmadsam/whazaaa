plugins {
    id 'com.android.application'
}

android {
    namespace 'app.didehban.bourse'
    compileSdk 34

    defaultConfig {
        applicationId 'app.didehban.bourse'
        minSdk 24
        targetSdk 34
        versionCode 21200
        versionName '2.12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // برای نصب مستقیم روی گوشی (بدون استور) با کلید دیباگ امضا می‌شود
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
